name: Verify synthetic laboratory
on:
  push:
    branches: [main, "bootstrap/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every advertised public ref
        run: git fetch origin '+refs/*:refs/audit/*'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install verification dependencies
        run: |
          npm ci
          pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr libimage-exiftool-perl
          python3 scripts/install_scanners.py --output "$RUNNER_TEMP/ble-map-scanners"
          echo "$RUNNER_TEMP/ble-map-scanners" >> "$GITHUB_PATH"
      - run: npx playwright install --with-deps chromium
      - name: Run complete sanitized verification
        run: python3 scripts/run_checks.py
      - name: Scan final workflow artifacts
        run: python3 scripts/privacy_gate.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-review-material
          path: review-output/
          retention-days: 7
          if-no-files-found: error
