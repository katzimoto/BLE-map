name: Privacy gate
on:
  push:
    branches: [main, "bootstrap/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every advertised public ref
        run: git fetch origin '+refs/*:refs/audit/*'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install verification dependencies
        run: |
          npm ci
          pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr libimage-exiftool-perl
          python3 scripts/install_scanners.py --output "$RUNNER_TEMP/ble-map-scanners"
          echo "$RUNNER_TEMP/ble-map-scanners" >> "$GITHUB_PATH"
      - name: Build and review packages without exposing raw logs
        run: |
          python3 scripts/reproducible_build.py
          python3 scripts/package_review.py
      - name: Inspect files, history, archives and metadata
        run: python3 scripts/privacy_gate.py
      - name: Complementary secret scanners
        run: python3 scripts/secret_scan.py
